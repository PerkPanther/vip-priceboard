name: fetch-assets
on:
  workflow_dispatch:
  push:
    branches: [claude/makechnags-access-check-05jhtz]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/makechnags-access-check-05jhtz
      - name: Find VersaSpa Pro product images
        run: |
          mkdir -p wix-scratch/versaspa-candidates
          cd wix-scratch/versaspa-candidates
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          : > candidates.txt
          # scrape manufacturer/vendor pages for product images
          for page in "https://versaspa.com/" "https://versaspa.com/products/versaspa-pro" "https://www.sunlessinc.com/versaspa/" "https://www.sunlessinc.com/product/versaspa-pro/" "https://sunlessinc.com/versaspa-pro/"; do
            curl -sSL -A "$UA" --max-time 25 "$page" -o page.html || continue
            grep -oE '(https?:)?//[^"'\'' >]+\.(png|jpg|jpeg|webp)[^"'\'' >]*' page.html | grep -i versa >> candidates.txt || true
          done
          # duckduckgo image search fallback
          vqd=$(curl -sSL -A "$UA" "https://duckduckgo.com/?q=versaspa+pro+spray+tan+booth" | grep -oE 'vqd="?[0-9-]+' | head -1 | grep -oE '[0-9-]+' || true)
          if [ -n "$vqd" ]; then
            curl -sSL -A "$UA" "https://duckduckgo.com/i.js?l=us-en&o=json&q=versaspa%20pro%20spray%20tan%20booth&vqd=$vqd" -o ddg.json || true
            grep -oE '"image":"[^"]+"' ddg.json | sed 's/"image":"//;s/"$//' | head -10 >> candidates.txt || true
          fi
          sed -i 's|^//|https://|' candidates.txt
          sort -u candidates.txt | head -20 > c2.txt && mv c2.txt candidates.txt
          rm -f page.html ddg.json
          n=0
          while read -r u; do
            n=$((n+1))
            ext="${u##*.}"; ext=$(echo "$ext" | cut -c1-4 | tr -cd 'a-zA-Z')
            [ -z "$ext" ] && ext=img
            curl -sSL -A "$UA" --max-time 25 -o "cand_$n.$ext" "$u" || true
          done < candidates.txt
          rm -f bing.html
          # drop anything that isn't a real decent-size image
          for f in cand_*; do
            [ -f "$f" ] || continue
            t=$(file -b --mime-type "$f")
            s=$(stat -c%s "$f")
            case "$t" in image/*) [ "$s" -gt 20000 ] || rm -f "$f";; *) rm -f "$f";; esac
          done
          ls -la
      - name: Commit results
        run: |
          git config user.name "asset-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fetch Wix assets for inspection" || echo "nothing to commit"
          git push

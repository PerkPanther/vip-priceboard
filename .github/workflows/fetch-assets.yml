name: fetch-assets
on:
  workflow_dispatch:
  push:
    branches: [claude/makechnags-access-check-05jhtz]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/makechnags-access-check-05jhtz
      - name: Find VersaSpa Pro product images
        run: |
          mkdir -p wix-scratch/versaspa-candidates
          cd wix-scratch/versaspa-candidates
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -sSL -A "$UA" "https://www.bing.com/images/search?q=versaspa+pro+spray+tan+booth+transparent+png&form=HDRSC2" -o bing.html || true
          grep -oE '"murl":"[^"]+"' bing.html | sed 's/"murl":"//;s/"$//' | sed 's/\\u0026/\&/g' | head -14 > candidates.txt || true
          n=0
          while read -r u; do
            n=$((n+1))
            ext="${u##*.}"; ext=$(echo "$ext" | cut -c1-4 | tr -cd 'a-zA-Z')
            [ -z "$ext" ] && ext=img
            curl -sSL -A "$UA" --max-time 25 -o "cand_$n.$ext" "$u" || true
          done < candidates.txt
          rm -f bing.html
          # drop anything that isn't a real decent-size image
          for f in cand_*; do
            [ -f "$f" ] || continue
            t=$(file -b --mime-type "$f")
            s=$(stat -c%s "$f")
            case "$t" in image/*) [ "$s" -gt 20000 ] || rm -f "$f";; *) rm -f "$f";; esac
          done
          ls -la
      - name: Commit results
        run: |
          git config user.name "asset-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fetch Wix assets for inspection" || echo "nothing to commit"
          git push

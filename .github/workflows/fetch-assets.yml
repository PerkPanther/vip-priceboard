name: fetch-assets
on:
  workflow_dispatch:
  push:
    branches: [claude/makechnags-access-check-05jhtz]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/makechnags-access-check-05jhtz
      - name: Fetch all Wix media originals
        run: |
          mkdir -p wix-scratch/all
          while read -r m; do
            [ -z "$m" ] && continue
            id=$(basename "$m")
            curl -sSL -o "wix-scratch/all/$id" "https://$m" || true
          done < wix-scratch/media-ids.txt
          ls -la wix-scratch/all
      - name: Commit results
        run: |
          git config user.name "asset-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fetch Wix assets for inspection" || echo "nothing to commit"
          git push
